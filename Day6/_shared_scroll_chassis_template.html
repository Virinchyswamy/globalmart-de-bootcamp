<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REPLACE ME — Day 6 Session Title</title>
<style>
  :root {
    --bg: #0f172a; --bg2: #111827; --panel: #1e293b; --panel2: #24324a;
    --border: #334155; --text: #e2e8f0; --muted: #94a3b8; --accent: #38bdf8;
    --accent2: #818cf8; --good: #22c55e; --bad: #f87171; --warn: #f59e0b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }
  a { color: var(--accent); }
  h1, h2, h3, h4 { font-weight: 800; letter-spacing: -0.01em; }
  code { background: #1e293b; border: 1px solid var(--border); padding: 2px 7px; border-radius: 5px; font-family: 'Cascadia Code', Consolas, monospace; font-size: 0.9em; color: #7dd3fc; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 28px; }

  /* PROGRESS + NAV */
  .progress-bar { position: fixed; top: 0; left: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); z-index: 300; width: 0%; transition: width 0.1s; }
  nav.topnav {
    position: sticky; top: 0; z-index: 200; background: rgba(15,23,42,0.94);
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--border);
  }
  nav.topnav .inner { max-width: 1080px; margin: 0 auto; padding: 12px 28px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  nav.topnav .brand { font-weight: 800; color: var(--accent); font-size: 13px; letter-spacing: 1px; }
  nav.topnav .links { display: flex; gap: 3px; flex-wrap: wrap; }
  nav.topnav .links a {
    text-decoration: none; color: var(--muted); font-size: 12.5px; font-weight: 600;
    padding: 6px 11px; border-radius: 20px; transition: all 0.2s; white-space: nowrap;
  }
  nav.topnav .links a:hover, nav.topnav .links a.active { background: var(--panel2); color: var(--text); }

  /* HERO */
  .hero { text-align: center; padding: 64px 24px 48px; background: radial-gradient(ellipse at top, #1e293b 0%, var(--bg) 65%); }
  .hero .eyebrow { color: var(--accent); font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 16px; }
  .hero h1 { font-size: 40px; background: linear-gradient(120deg, #f8fafc, var(--accent) 60%); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 16px; }
  .hero p.lead { color: var(--muted); font-size: 16.5px; max-width: 700px; margin: 0 auto 26px; }
  .hero .cta { display: inline-block; background: var(--accent); color: #0f172a; font-weight: 700; padding: 12px 26px; border-radius: 10px; text-decoration: none; font-size: 14.5px; }
  .hero .cta:hover { background: #5fd0ff; }
  .hero .meta-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 22px; }
  .hero .meta-pill { background: var(--panel2); border: 1px solid var(--border); color: var(--muted); font-size: 12.5px; padding: 6px 14px; border-radius: 20px; }

  /* SECTIONS */
  section.content { padding: 56px 0; border-bottom: 1px solid var(--border); }
  section.content:nth-of-type(even) { background: var(--bg2); }
  .section-tag { color: var(--accent2); font-size: 12.5px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
  .section-title { font-size: 28px; margin-bottom: 12px; }
  .section-intro { color: var(--muted); font-size: 15.5px; max-width: 780px; margin-bottom: 30px; }

  /* CARDS */
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  @media (max-width: 800px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px 22px; }
  .card h4 { color: var(--accent); font-size: 15px; margin-bottom: 8px; }
  .card p, .card li { color: #cbd5e1; font-size: 14px; }
  .card ul, .card ol { padding-left: 18px; margin-top: 6px; }
  .card.small { padding: 14px 16px; }

  .highlight-box { background: #14243d; border: 1px solid var(--accent); border-radius: 10px; padding: 16px 20px; margin-top: 16px; }
  .highlight-box p { font-size: 14px; line-height: 1.7; color: #cbd5e1; }
  .highlight-box.warn { background: #2d1e0e; border-color: var(--warn); }
  .highlight-box.success { background: #0d2d1a; border-color: var(--good); }
  .highlight-box b { color: var(--text); }

  /* STEP LIST */
  .order-list { counter-reset: steps; list-style: none; margin: 18px 0; }
  .order-list li {
    counter-increment: steps; display: flex; align-items: flex-start;
    gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--border);
    font-size: 14.5px; color: #cbd5e1; line-height: 1.65;
  }
  .order-list li:last-child { border-bottom: none; }
  .order-list li::before {
    content: counter(steps);
    background: #1d4ed8; color: #fff; min-width: 26px; height: 26px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; flex-shrink: 0; margin-top: 2px;
  }

  /* TABLE */
  table.spec { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13.5px; }
  table.spec th { background: var(--panel2); color: var(--accent); padding: 9px 13px; text-align: left; border: 1px solid var(--border); }
  table.spec td { padding: 9px 13px; border: 1px solid var(--border); color: #cbd5e1; }
  table.spec tr:nth-child(even) td { background: #16213a; }

  /* DETAILS / HINTS (used for asides, nudges, extra context) */
  details.hint { background: #14243d; border: 1px solid var(--border); border-radius: 10px; margin-top: 14px; padding: 4px 0; }
  details.hint summary { cursor: pointer; padding: 12px 18px; font-size: 13.5px; font-weight: 700; color: var(--accent2); list-style: none; display: flex; align-items: center; gap: 8px; }
  details.hint summary::-webkit-details-marker { display: none; }
  details.hint summary::before { content: '💡'; }
  details.hint[open] summary { border-bottom: 1px solid var(--border); }
  details.hint .hint-body { padding: 14px 18px 16px; font-size: 14px; color: #cbd5e1; line-height: 1.7; }
  details.hint .hint-body p + p { margin-top: 10px; }

  /* Q&A / QUICK-FIRE ACCORDION (for the quiz sections) */
  details.qa-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 12px; padding: 4px 0; }
  details.qa-card summary { cursor: pointer; padding: 14px 18px; font-size: 14px; font-weight: 600; color: var(--text); list-style: none; }
  details.qa-card summary::-webkit-details-marker { display: none; }
  details.qa-card summary::before { content: "Q — "; color: var(--accent); font-weight: 700; }
  details.qa-card[open] summary { color: #7dd3fc; border-bottom: 1px solid var(--border); }
  details.qa-card .qa-answer { padding: 14px 18px 16px; color: #cbd5e1; font-size: 13.5px; line-height: 1.7; }
  details.qa-card .qa-answer::before { content: "A — "; color: var(--good); font-weight: 700; }

  /* CODE BLOCKS (for HOL1's real PySpark) */
  pre {
    background: #0d1117; border: 1px solid #21262d; border-radius: 10px;
    padding: 18px 20px; overflow-x: auto; font-family: 'Cascadia Code', 'Consolas', monospace;
    font-size: 13px; line-height: 1.7; color: #e6edf3; margin-top: 14px;
  }
  pre code { background: none; border: none; padding: 0; color: inherit; font-size: inherit; }
  .kw { color: #ff7b72; font-weight: bold; }
  .fn { color: #d2a8ff; }
  .str { color: #a5d6ff; }
  .cm { color: #6e7681; font-style: italic; }
  .col { color: #79c0ff; }
  .tbl { color: #ffa657; }
  .demo-label { color: #78716c; font-size: 13px; margin-bottom: 4px; }

  /* CHECKPOINT (verification / recap callouts) */
  .checkpoint { background: rgba(34,197,94,0.08); border: 1.5px solid var(--good); border-radius: 12px; padding: 18px 22px; margin-top: 20px; }
  .checkpoint .cp-tag { color: var(--good); font-weight: 800; font-size: 12.5px; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px; }
  .checkpoint p { color: #cbd5e1; font-size: 14.5px; line-height: 1.7; }

  /* NUMBERED PHASE HEADER */
  .phase-num { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #0f172a; font-weight: 800; font-size: 15px; margin-right: 10px; }

  /* PILLS */
  .pill { display: inline-block; padding: 3px 11px; border-radius: 20px; font-size: 11.5px; font-weight: 700; margin: 2px 4px 2px 0; }
  .pill-blue { background: #1d4ed8; color: #bfdbfe; }
  .pill-green { background: #15803d; color: #bbf7d0; }
  .pill-amber { background: #92400e; color: #fde68a; }
  .pill-red { background: #7f1d1d; color: #fecaca; }
  .pill-purple { background: #6d28d9; color: #ddd6fe; }

  footer { text-align: center; padding: 44px 24px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--border); }

  @media (max-width: 640px) {
    nav.topnav .links { display: none; }
    .hero h1 { font-size: 30px; }
  }
</style>
</head>
<body>

<div class="progress-bar" id="progressBar"></div>

<nav class="topnav">
  <div class="inner">
    <div class="brand">REPLACE ME — DAY 6 · SESSION LABEL</div>
    <div class="links">
      <!-- one <a href="#sectionId" class="navlink">Short Label</a> per major section -->
    </div>
  </div>
</nav>

<header class="hero">
  <div class="eyebrow">REPLACE ME — session type / duration</div>
  <h1>REPLACE ME — Session Title</h1>
  <p class="lead">REPLACE ME — one-paragraph framing.</p>
  <div class="meta-row">
    <span class="meta-pill">REPLACE ME</span>
  </div>
</header>

<!-- Repeat this pattern for every major section. Give each <section> a unique id
     matching one of the nav links above, and alternate implicit background via
     nth-of-type(even) — already handled by the CSS, just keep sections in order. -->
<section class="content" id="REPLACE_ME">
  <div class="wrap">
    <div class="section-tag">Section Label</div>
    <h2 class="section-title">Section Title</h2>
    <p class="section-intro">One or two sentence framing for this section.</p>

    <!-- content: .grid-2/.grid-3 of .card, .highlight-box, table.spec, .order-list,
         details.hint, details.qa-card, pre code blocks, .checkpoint -->
  </div>
</section>

<footer>
  REPLACE ME — GlobalMart Data Engineering Bootcamp — Day 6 · Session Label
</footer>

<script>
  const sections = document.querySelectorAll('section.content');
  const navLinks = document.querySelectorAll('.navlink');
  const progressBar = document.getElementById('progressBar');

  function onScroll() {
    const scrollTop = window.scrollY;
    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
    progressBar.style.width = (docHeight > 0 ? (scrollTop / docHeight) * 100 : 0) + '%';

    let current = '';
    sections.forEach(sec => {
      const rect = sec.getBoundingClientRect();
      if (rect.top <= 120 && rect.bottom > 120) current = sec.id;
    });
    navLinks.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + current));
  }
  window.addEventListener('scroll', onScroll);
  onScroll();
</script>

</body>
</html>
