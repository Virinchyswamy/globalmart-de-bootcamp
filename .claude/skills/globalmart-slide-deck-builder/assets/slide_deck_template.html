<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REPLACE_ME_TITLE</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; }

  /* --- NAV --- */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: #1e293b; border-bottom: 1px solid #334155;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 24px;
  }
  nav .logo { font-weight: 700; font-size: 14px; color: #38bdf8; letter-spacing: 1px; }
  nav .controls { display: flex; gap: 10px; align-items: center; }
  nav button {
    background: #334155; border: none; color: #e2e8f0; padding: 6px 16px;
    border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  nav button:hover { background: #38bdf8; color: #0f172a; }
  nav .slide-counter { font-size: 13px; color: #94a3b8; }

  /* --- SLIDES --- */
  .deck { padding-top: 60px; }
  .slide {
    display: none; min-height: 100vh; padding: 48px 60px;
    animation: fadeIn 0.3s ease;
  }
  .slide.active { display: flex; flex-direction: column; justify-content: center; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* --- SLIDE TYPES --- */
  .slide-cover { background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%); text-align: center; align-items: center; }
  .slide-cover h1 { font-size: 48px; font-weight: 800; color: #38bdf8; margin-bottom: 12px; }
  .slide-cover .subtitle { font-size: 20px; color: #94a3b8; max-width: 640px; }
  .slide-cover .badge { margin-top: 20px; background: #1d4ed8; padding: 6px 18px; border-radius: 20px; font-size: 13px; }

  .slide-section { background: #1e293b; }
  .slide-section h2 { font-size: 36px; font-weight: 700; color: #38bdf8; margin-bottom: 8px; }
  .slide-section .section-tag { color: #64748b; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 28px; }

  .slide-content { background: #0f172a; }
  .slide-content h3 { font-size: 26px; font-weight: 700; color: #f8fafc; margin-bottom: 20px; }

  .slide-demo { background: #0c1a2e; border-left: 4px solid #f59e0b; }
  .slide-demo h3 { font-size: 22px; color: #f59e0b; margin-bottom: 6px; }
  .slide-demo .demo-label { color: #78716c; font-size: 13px; margin-bottom: 20px; }

  /* --- COMPONENTS --- */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }

  .card {
    background: #1e293b; border: 1px solid #334155; border-radius: 12px;
    padding: 20px 24px;
  }
  .card h4 { color: #38bdf8; margin-bottom: 10px; font-size: 15px; }
  .card p, .card li { color: #cbd5e1; font-size: 14px; line-height: 1.7; }
  .card ul, .card ol { padding-left: 16px; }

  .highlight-box {
    background: #1a2e4a; border: 1px solid #3b82f6; border-radius: 10px;
    padding: 16px 20px; margin-top: 16px;
  }
  .highlight-box.warn { background: #2d1b0e; border-color: #f59e0b; }
  .highlight-box.success { background: #0d2d1a; border-color: #22c55e; }
  .highlight-box p { font-size: 14px; line-height: 1.7; color: #cbd5e1; }

  pre {
    background: #0d1117; border: 1px solid #21262d; border-radius: 10px;
    padding: 18px 20px; overflow-x: auto; font-family: 'Cascadia Code', 'Consolas', monospace;
    font-size: 13px; line-height: 1.7; color: #e6edf3;
  }
  .kw { color: #ff7b72; font-weight: bold; }
  .fn { color: #d2a8ff; }
  .str { color: #a5d6ff; }
  .cm { color: #6e7681; font-style: italic; }
  .col { color: #79c0ff; }
  .tbl { color: #ffa657; }

  .pill {
    display: inline-block; padding: 3px 12px; border-radius: 20px;
    font-size: 12px; font-weight: 600; margin: 2px;
  }
  .pill-blue { background: #1d4ed8; color: #bfdbfe; }
  .pill-green { background: #15803d; color: #bbf7d0; }
  .pill-amber { background: #92400e; color: #fde68a; }

  .order-list { counter-reset: steps; list-style: none; padding: 0; }
  .order-list li {
    counter-increment: steps; display: flex; align-items: flex-start;
    gap: 14px; padding: 10px 0; border-bottom: 1px solid #1e293b;
    font-size: 14px; color: #cbd5e1; line-height: 1.6;
  }
  .order-list li::before {
    content: counter(steps);
    background: #1d4ed8; color: #fff; min-width: 26px; height: 26px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; flex-shrink: 0;
  }

  table.sql-table {
    width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px;
  }
  table.sql-table th {
    background: #1d4ed8; color: #fff; padding: 8px 12px; text-align: left;
  }
  table.sql-table td {
    border: 1px solid #1e293b; padding: 7px 12px; color: #cbd5e1;
    background: #111827;
  }
  table.sql-table tr:nth-child(even) td { background: #0f172a; }
</style>
</head>
<body>

<nav>
  <div class="logo">REPLACE_ME_NAV_LABEL</div>
  <div class="controls">
    <button onclick="changeSlide(-1)">&#8592; Prev</button>
    <span class="slide-counter" id="counter">1 / REPLACE_ME_TOTAL_SLIDES</span>
    <button onclick="changeSlide(1)">Next &#8594;</button>
  </div>
</nav>

<div class="deck">

<!-- SLIDES GO HERE -->
<!--
  Insert this session's real <div class="slide slide-cover active">...</div>
  and subsequent <div class="slide slide-section|slide-content|slide-demo">...</div>
  blocks here, in presentation order. The first slide in the markup must carry
  the literal "active" class (slide 1) -- the nav JS below manages "active" on
  every slide after that, it does not need to be added anywhere else by hand.
  Update the <title>, the nav .logo text, and the initial "1 / N" counter text
  above to match this deck's real title and real final slide count before
  shipping.
-->

</div><!-- /deck -->

<script>
  let current = 0;
  const slides = document.querySelectorAll('.slide');
  const counter = document.getElementById('counter');

  function showSlide(n) {
    slides[current].classList.remove('active');
    current = (n + slides.length) % slides.length;
    slides[current].classList.add('active');
    counter.textContent = (current + 1) + ' / ' + slides.length;
  }

  function changeSlide(dir) { showSlide(current + dir); }

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') changeSlide(1);
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   changeSlide(-1);
  });
</script>
</body>
</html>
